name: build

on:
  workflow_dispatch: # Actions 탭에서 수동 실행
  push:
    tags: ['v*'] # v0.1.0 같은 태그를 올리면 자동 실행 + Releases 에 업로드

permissions:
  contents: write # 태그 빌드 시 Releases 에 파일을 올리기 위해 필요

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: release/*.dmg
          - os: windows-latest
            script: dist:win
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: egg-pet-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Releases 에 올리기 (태그일 때만)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          draft: true
